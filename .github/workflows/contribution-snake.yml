name: GitHub Snake Game
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3, SVG and GIF
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish output branch without force push
        shell: bash
        run: |
          publish_dir="$(mktemp -d)"
          cp dist/github-snake.svg dist/github-snake-dark.svg dist/ocean.gif "$publish_dir/"
          if git ls-remote --exit-code --heads origin output; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          cp "$publish_dir/github-snake.svg" "$publish_dir/github-snake-dark.svg" "$publish_dir/ocean.gif" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg ocean.gif
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): update snake animation [skip ci]'
            git push origin HEAD:output
          fi
