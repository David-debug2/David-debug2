name: Refresh profile
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'scripts/**', 'tests/**', 'data/projects.json', 'package.json', '.github/workflows/refresh-profile.yml']
permissions:
  contents: read
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test generator
        run: npm test
      - name: Refresh profile
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run generate
      - name: Commit changed generated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/*.svg data/youtube.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh videos and stats'
            git push origin HEAD:main
          fi
