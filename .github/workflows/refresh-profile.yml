name: Refresh profile
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'scripts/**', 'package.json', '.github/workflows/refresh-profile.yml']
permissions:
  contents: read
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Refresh profile
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run generate
      - name: Commit changed generated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/youtube.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh YouTube videos'
            git push origin HEAD:main
          fi
